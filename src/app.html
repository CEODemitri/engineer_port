<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<script>
			// Guard against getter-only window.fetch in restricted iframe/extension environments
			(function () {
				try {
					var rawFetch = window.fetch;
					var currentFetch = rawFetch;
					Object.defineProperty(window, 'fetch', {
						get: function () {
							return currentFetch;
						},
						set: function (fn) {
							currentFetch = fn;
						},
						configurable: true,
						enumerable: true
					});
				} catch (e) {
					// Silent fallback
				}
			})();
		</script>

		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>DEMITRI — Creative Developer</title>
		<meta
			name="description"
			content="Demitri — Creative developer marching towards the future. Full-stack software engineer building measurable results."
		/>
		<meta name="theme-color" content="#FFFFFF" />
		<meta property="og:title" content="DEMITRI — Creative Developer" />
		<meta
			property="og:description"
			content="Creative developer marching towards the future. Measurable results. Business problems solved. Code that ships and stays working."
		/>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<!-- Google Fonts: Archivo Black, EB Garamond (Italic), Inter, JetBrains Mono, Noto Serif JP, Shippori Mincho -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=EB+Garamond:ital,wght@1,400;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+JP:wght@400;600;700;900&family=Shippori+Mincho:wght@500;700;800&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="bg-white text-[#333333] antialiased selection:bg-[#4682B4] selection:text-white"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
